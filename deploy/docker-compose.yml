# Console deployment compose file. Two services:
#
#   - server: the Fastify API + WS surface (built from ../Dockerfile).
#   - web:    nginx serving the SPA bundle (built from ./web.Dockerfile).
#
# This compose does NOT bring up Postgres / Kafka / Redis / the OCPP
# gateway — the console is intentionally a *consumer* of the gateway
# stack. Point GATEWAY_BASE_URL + KAFKA_BROKERS at an existing gateway
# deployment.
#
# Run from the repo root:
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Reachable at http://localhost:5180 (web) and http://localhost:8090 (server).

name: eveys-console

services:
  # One-shot init: chown the shared volume to the nonroot UID the
  # server runs as (distroless nodejs20 nonroot = 65532). Without this,
  # the named volume comes up root-owned on first boot and the server
  # gets EACCES the moment it tries to write
  # `/data/alertmanager-managed.yml` or open the diagnostics SQLite.
  # Idempotent on subsequent runs.
  server-init:
    image: busybox:1.36
    container_name: eveys-console-server-init
    command: ['sh', '-c', 'mkdir -p /data && chown -R 65532:65532 /data']
    volumes:
      - console-data:/data
    restart: 'no'

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    image: eveys-console-server:dev
    container_name: eveys-console-server
    depends_on:
      server-init:
        condition: service_completed_successfully
    # Attach to the gateway's network so the server can reach Kafka via
    # the INTERNAL listener (`kafka:29092`) and the gateway REST via
    # the container name (`eveys-ocpp:8080`). The translation in
    # scripts/updater.sh rewrites `localhost`/`127.0.0.1` in
    # KAFKA_BROKERS / GATEWAY_BASE_URL to those internal hostnames so
    # the operator's .env keeps working for `pnpm dev` unchanged.
    networks:
      - default
      - ocpp-gateway
    # Linux compat: lets `host.docker.internal:` URLs (e.g. for an
    # ALERTMANAGER_URL pointing at the host) resolve when not using
    # the gateway-internal hostnames.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      HOST: 0.0.0.0
      PORT: 8090
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: 'false'
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env or the host env}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-eveys-console}
      JWT_ISSUER: ${JWT_ISSUER:-eveys-console}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-28800}
      # Plaintext credentials hashed at boot. Convenient for laptop
      # docker runs; production should set CONSOLE_USERS to a CSV of
      # `username:bcrypthash` instead and leave the plaintext pair
      # empty.
      CONSOLE_USERNAME: ${CONSOLE_USERNAME:-}
      CONSOLE_PASSWORD: ${CONSOLE_PASSWORD:-}
      CONSOLE_USERS: ${CONSOLE_USERS:-}
      AUTH_POW_DIFFICULTY: ${AUTH_POW_DIFFICULTY:-16}
      AUTH_POW_TTL_SECONDS: ${AUTH_POW_TTL_SECONDS:-120}
      AUTH_LOGIN_MAX_PER_MIN: ${AUTH_LOGIN_MAX_PER_MIN:-5}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      GATEWAY_BASE_URL: ${GATEWAY_BASE_URL:?set GATEWAY_BASE_URL — points at the OCPP gateway REST API}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?set GATEWAY_TOKEN — bearer accepted by the gateway}
      KAFKA_BROKERS: ${KAFKA_BROKERS:?set KAFKA_BROKERS — CSV of host:port}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-eveys-console}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-eveys-console}
      KAFKA_TOPICS_BOOT: ${KAFKA_TOPICS_BOOT:-cp.boot}
      KAFKA_TOPICS_STATUS: ${KAFKA_TOPICS_STATUS:-cp.status}
      KAFKA_TOPICS_METER: ${KAFKA_TOPICS_METER:-cp.meter}
      KAFKA_TOPICS_TX_STARTED: ${KAFKA_TOPICS_TX_STARTED:-tx.started}
      WS_MAX_SUBSCRIPTIONS_PER_CONN: ${WS_MAX_SUBSCRIPTIONS_PER_CONN:-50}
      WS_PING_INTERVAL_MS: ${WS_PING_INTERVAL_MS:-30000}
      WS_IDLE_TIMEOUT_MS: ${WS_IDLE_TIMEOUT_MS:-120000}
      # Alertmanager — points at the in-stack service when the
      # observability profile is up. The /sys/alerts/firing route
      # handles an unreachable Alertmanager gracefully (returns
      # `{ alerts: [], unavailable: true }`), so leaving this set
      # while the profile is down is harmless.
      ALERTMANAGER_URL: ${ALERTMANAGER_URL:-http://alertmanager:9093}
      # Prometheus — points at the in-stack service. The Rules tab on
      # /sys/alerts proxies /api/v1/rules through this. When unset
      # (or unreachable) the tab renders "Prometheus not configured".
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      # Path inside the container where the Console writes the
      # managed Alertmanager config. The Alertmanager service below
      # mounts the same named volume read-only and points its
      # --config.file at it, so writes from the Channels tab take
      # effect on the next /-/reload.
      ALERTMANAGER_CONFIG_PATH: /data/alertmanager-managed.yml
      # Console-managed Alertmanager templates file. The Console
      # writes here in *its* container; the Alertmanager service
      # mounts the same named volume and reads the file at
      # ALERTMANAGER_TEMPLATES_IN_CONTAINER_PATH below — which is
      # what the managed config's `templates:` block points at.
      ALERTMANAGER_TEMPLATES_PATH: /data/alertmanager-templates.yml
      ALERTMANAGER_TEMPLATES_IN_CONTAINER_PATH: /etc/alertmanager-managed/alertmanager-templates.yml
    ports:
      - '8090:8090'
    volumes:
      - console-data:/data
    # CMD (not CMD-SHELL) — the runtime is distroless and has no shell.
    # Calling node directly skips the sh wrap. Node is at /nodejs/bin/node
    # in gcr.io/distroless/nodejs20-debian12; the fetch global is built-in
    # on Node 20.
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "fetch('http://localhost:8090/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      # Vite inlines VITE_* at build time. Passed through here so the
      # operator's repo-root .env (or apps/web/.env, picked up by
      # scripts/updater.sh) reaches the bundle. Without these, the SPA
      # falls back to `${hostname}:8090/api` and bypasses the reverse
      # proxy.
      args:
        VITE_CONSOLE_BASE_URL: ${VITE_CONSOLE_BASE_URL:-}
        VITE_WS_URL: ${VITE_WS_URL:-}
    image: eveys-console-web:dev
    container_name: eveys-console-web
    ports:
      - '5180:80'
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  # Observability stack — opt-in via `--profile observability`. A default
  # `docker compose up` skips these so the dev loop stays lean.
  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: eveys-console-prometheus
    profiles: [observability]
    # Host port 9090 is commonly taken by the OCPP simulator's Prometheus,
    # so the Console's lives on 9091 → 9090 inside the container.
    ports:
      - '9091:9090'
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Console-managed rules file: shares the `console-data` volume
      # with the Console server (which writes /data/alerts-managed.yml).
      # Mounted read-only inside Prometheus; the prometheus.yml's
      # rule_files list points at this path.
      - console-data:/etc/prometheus-managed:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    extra_hosts:
      # Linux compat: lets the gateway target `host.docker.internal:9100`
      # resolve when scraping a gateway running on the host.
      - 'host.docker.internal:host-gateway'
    # No `depends_on: server` here. Prometheus is happy starting before
    # the things it scrapes — it retries on its own — and requiring the
    # `server` container forces every observability-profile run to also
    # bring up the full gateway/Kafka env set even when the operator
    # only wants to scrape a Console running on the host or under
    # `pnpm dev`.
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: eveys-console-alertmanager
    profiles: [observability]
    ports:
      - '9093:9093'
    volumes:
      # Read the Console-managed config. The Console writes
      # /data/alertmanager-managed.yml in its container; the same
      # named volume is mounted here read-only. The bundled file
      # under ./observability/alertmanager.yml stays as a documented
      # seed; the Console copies it on first boot if the managed file
      # doesn't exist yet.
      - console-data:/etc/alertmanager-managed:ro
      - ./observability/alertmanager.yml:/etc/alertmanager-seed/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager-managed/alertmanager-managed.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
      # Lifecycle endpoint needed for POST /-/reload after Console writes.
      - '--web.enable-lifecycle'
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  prometheus-data:
  alertmanager-data:
  # Shared between Console (writable) and Alertmanager (read-only).
  # Holds the managed Alertmanager config plus the diagnostics SQLite
  # + uploads from the existing data dir. Survives `docker compose
  # down`; cleared by `docker compose down -v`.
  console-data:

# Networks. The Console runs in its own `default` net for inter-service
# wiring (server <-> web <-> alertmanager). It ALSO attaches to the
# gateway's `eveys-ocpp_default` net (declared external below) so the
# server can talk to the gateway's Kafka via the INTERNAL listener
# (`kafka:29092`) and to the gateway's REST surface via the container
# name (`eveys-ocpp:8080`) — both of which round-trip cleanly inside
# Docker without the advertised-listener mismatch that breaks the
# `host.docker.internal:9092` path. The Console-managed updater
# (scripts/updater.sh) auto-translates `localhost`/`127.0.0.1` in
# KAFKA_BROKERS / GATEWAY_BASE_URL accordingly when it sees the
# gateway network present.
#
# If the gateway is NOT running, the external network won't exist and
# `docker compose up` will error. Bring the gateway up first
# (`make compose-up` in the eveys-mobility/OCPP repo) or temporarily
# remove the `ocpp-gateway` attachment from the `server` service for a
# Console-only run.
networks:
  default:
  ocpp-gateway:
    external: true
    name: eveys-ocpp_default
